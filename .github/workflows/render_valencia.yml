name: Render Valencia smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender and dependencies (bounded)
        timeout-minutes: 7
        run: |
          set -euxo pipefail
          timeout 240s sudo apt-get update
          timeout 180s sudo apt-get install -y blender python3-shapely
          blender --version
          python3 -c "import shapely; print('Shapely', shapely.__version__)"

      - name: Prepare renderer data
        timeout-minutes: 3
        run: |
          set -euxo pipefail
          mkdir -p /tmp/valencia_data /tmp/valencia_render
          cp "Valencia/dati completi/dati_generati/"* /tmp/valencia_data/
          cp "Valencia/dati completi/config/city_valencia.json" /tmp/city_valencia.json
          python3 - <<'PY'
          import json, os
          p = "/tmp/city_valencia.json"
          d = json.load(open(p, encoding="utf-8"))
          print("City:", d.get("name"), "center:", d.get("lat0"), d.get("lon0"))
          print("Prepared data files:")
          for f in sorted(os.listdir("/tmp/valencia_data")):
              print(f, os.path.getsize(os.path.join("/tmp/valencia_data", f)))
          PY

      - name: Render one low-resolution frame
        timeout-minutes: 8
        run: |
          set -euxo pipefail
          blender -b -t 2 --python-exit-code 1 --python build_render.py -- /tmp/valencia_data /tmp/valencia_render --frames 1 1 --res 640 360 --samples 1 --city /tmp/city_valencia.json --years 2026 2026
          test -n "$(find /tmp/valencia_render -maxdepth 1 -type f -size +0c -print -quit)"

      - name: Upload render and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valencia-blender-smoke-test
          path: /tmp/valencia_render/
          if-no-files-found: warn
          retention-days: 7
